name: Build Telemetry C3 & HUD S3 (Arduino CLI)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_arduino_modules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          if [ -f "./bin/arduino-cli" ]; then
            sudo mv ./bin/arduino-cli /usr/local/bin/
          elif [ -f "$HOME/bin/arduino-cli" ]; then
            sudo mv "$HOME/bin/arduino-cli" /usr/local/bin/
          fi
          arduino-cli version

      - name: Configure ESP32 Core & Libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.1.1
          arduino-cli lib install "ArduinoJson" "ESPAsyncWebServer" "AsyncTCP" "LovyanGFX" "RTClib" "Adafruit Fingerprint Sensor Library" "ChronosESP32"

      - name: Patch ESPAsyncWebServer mbedTLS MD5 for IDF v5.3
        run: |
          AUTH_FILE="$HOME/Arduino/libraries/ESPAsyncWebServer/src/WebAuthentication.cpp"
          if [ -f "$AUTH_FILE" ]; then
            sed -i 's/mbedtls_md5_starts_ret(/mbedtls_md5_starts(/g' "$AUTH_FILE"
            sed -i 's/mbedtls_md5_update_ret(/mbedtls_md5_update(/g' "$AUTH_FILE"
            sed -i 's/mbedtls_md5_finish_ret(/mbedtls_md5_finish(/g' "$AUTH_FILE"
          fi

      - name: Compile Telemetry C3 (v10)
        run: |
          mkdir -p out/tele_c3
          arduino-cli compile --fqbn esp32:esp32:esp32c3:CDCOnBoot=cdc --export-binaries --output-dir out/tele_c3 tele_c3_arduino

      - name: Patch HUD S3 v23 for Core 3.1.1 Compatibility
        run: |
          python3 - <<'EOF'
          from pathlib import Path

          p = Path("hud_s3_arduino/fixed_firmware_Satria_HUD_Fixed-v23.cpp")
          src = p.read_text(encoding="utf-8")

          src = src.replace(
              "#include <ChronosESP32.h>",
              "#define DateTime ChronosDateTime\n#include <ChronosESP32.h>\n#undef DateTime",
              1,
          )

          if "void triggerPopup(" not in src and "void setSeatRelayHold(" in src:
              src = src.replace(
                  "void setSeatRelayHold(",
                  "void triggerPopup(const char* title, const char* subtitle, uint16_t color, uint32_t durationMs);\nvoid setSeatRelayHold(",
                  1,
              )

          src = src.replace(
              "void onTciEspNowSent(const wifi_tx_info_t *info, esp_now_send_status_t status)",
              "void onTciEspNowSent(const uint8_t *mac_addr, esp_now_send_status_t status)",
          )

          p.write_text(src, encoding="utf-8")
          EOF

      - name: Compile HUD S3 (v23)
        run: |
          mkdir -p out/hud_s3
          arduino-cli compile --fqbn esp32:esp32:esp32s3:PSRAM=opi,CDCOnBoot=cdc --export-binaries --output-dir out/hud_s3 hud_s3_arduino

      - name: List Compiled .bin Files
        run: |
          find out -type f -name "*.bin" -exec ls -lh {} +

      - name: Upload Compiled .bin Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: satria-c3-hud-bins
          path: out/**/*.bin
          if-no-files-found: error
